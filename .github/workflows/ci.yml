name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build # generates .void route types needed by typecheck
      - run: bun run typecheck
      - run: bun run test

  deploy:
    name: Deploy to Cloudflare Workers
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: number-renda-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # TEMP: make void print the cf output it hides in this error; remove after fixing
      - run: |
          node -e '
          const fs = require("fs");
          const f = "node_modules/@void/deploy-cloudflare/dist/index.mjs";
          const s = fs.readFileSync(f, "utf8");
          const a = "before retrying.`);";
          if (!s.includes(a)) throw new Error("patch target not found");
          fs.writeFileSync(f, s.replace(a, "before retrying. DEBUG: ${JSON.stringify({ op: operation.type, status: result.status, signal: result.signal, error: result.error, errorCode: result.errorCode, failure: result.failure, stderr: String(result.stderr).slice(0, 2000), stdout: String(result.stdout).slice(0, 500) })}`);"));
          '
      - run: bunx void deploy --platform cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
